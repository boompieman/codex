name: AI ERP upstream sync

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync main and open the release update PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$REPO/merge-upstream" -f branch=main

          ahead=$(gh api "repos/$REPO/compare/release%2Fai-erp...main" --jq .ahead_by)
          if [ "$ahead" -eq 0 ]; then
            exit 0
          fi

          open_prs=$(gh pr list --repo "$REPO" --base release/ai-erp --head main --state open --json number --jq length)
          if [ "$open_prs" -eq 0 ]; then
            gh pr create \
              --repo "$REPO" \
              --base release/ai-erp \
              --head main \
              --title "chore: sync OpenAI Codex upstream" \
              --body "Automated upstream update. Merge after the AI ERP compatibility checks pass."
          fi
